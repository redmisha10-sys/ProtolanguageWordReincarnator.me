<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protolanguage Word Reincarnaitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Protolanguage Reincarnaitor</h1>
            <p>Enter cognates from different languages to reconstruct the ancestral proto-word.</p>
        </header>

        <section class="input-section">
            <input type="text" id="word-input" placeholder="Type a word (e.g., pater)" autocomplete="off">
            <div class="buttons">
                <button id="add-word-btn">Next Word</button>
                <button id="build-proto-btn">Build Word of Protolanguage</button>
                <button id="clear-btn">Clear All</button>
            </div>
            <p class="hint">💡 Tip: Use IPA characters (like æ, ʃ, θ) or combine vowels (ae, oe) for better accuracy.</p>
        </section>

        <section class="word-pool">
            <h2>Words in the Pool:</h2>
            <ul id="word-list">
                <!-- Words will appear here -->
                <li class="empty-msg">No words added yet.</li>
            </ul>
        </section>

        <section id="result-section" class="hidden">
            <h2>Reconstructed Proto-Word:</h2>
            <div id="proto-word-display"></div>
        </section>
	<a href="https://www.youtube.com/@mihaylianempire">Visit my YouTube</a>
    </main>

    <script src="script.js"></script>
</body>
</html>
